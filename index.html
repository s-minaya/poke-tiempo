<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: la pestaña usa el de 32px; el de 192px, las pantallas de
         alta densidad y los accesos directos. En `public/`. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PokéTiempo: consulta la previsión de España, Portugal y Andorra en un mapa donde cada condición meteorológica tiene su propio Pokémon."
    />
    <title>Poketiempo</title>
    <!-- Pixelify Sans (línea de previsión de la cabecera) y Nunito Sans
         (leyenda, créditos, temperaturas del mapa) — Google Fonts, sin
         dependencia JS. Poketiempo Unown (título + encabezado de la
         leyenda) se sirve local, ver Header.scss. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Pixelify+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
